<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #00FFBC;
            color: white;
            text-align: center;
            padding: 20px 0;
        }

        main {
            padding: 20px;
            text-align: center;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }

        a {
            color: #007BFF;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>Hoşgeldiniz!</h1>
        <p>Basit bir site örneği</p>
    </header>

    <main>
        <h2>Hakkında</h2>
        <p>Bu, HTML ve CSS kullanarak yapılmış çok basit bir site örneğidir. Amacımız temel yapı taşlarını göstermek.</p>
        <p>Daha fazla bilgi için <a href="https://www.example.com">buraya tıklayın</a>.</p>
    </main>

    <footer>
        <p>© 2025 Basit Site | Tüm hakları saklıdır.</p>
    </footer>

</body>
</html>
